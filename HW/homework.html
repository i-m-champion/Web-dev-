<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Name Grid</title>
    <style>
        /* Remove default spacing */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Full-screen page */
        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: "Times New Roman", serif;
        }

        /* Image covers the entire screen, is transparent, and won't scroll */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.7; /* Adjust this value between 0 (fully invisible) and 1 (fully opaque) */
            pointer-events: none; /* Prevents the image from capturing clicks */
        }

        /* Arrange names in 3 rows and 3 columns */
        .name-grid {
            position: fixed;
            inset: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 16px;
            color: black;
            font-size: 14px;
            font-weight: bold;
        }

        /* 1. Top Left */
        .name-grid div:nth-child(1) { justify-self: start; align-self: start; }
        /* 2. Top Center */
        .name-grid div:nth-child(2) { justify-self: center; align-self: start; }
        /* 3. Top Right */
        .name-grid div:nth-child(3) { justify-self: end; align-self: start; }

        /* 4. Middle Left */
        .name-grid div:nth-child(4) { justify-self: start; align-self: center; }
        /* 5. Center */
        .name-grid div:nth-child(5) { justify-self: center; align-self: center; }
        /* 6. Middle Right */
        .name-grid div:nth-child(6) { justify-self: end; align-self: center; }

        /* 7. Bottom Left */
        .name-grid div:nth-child(7) { justify-self: start; align-self: end; }
        /* 8. Bottom Center */
        .name-grid div:nth-child(8) { justify-self: center; align-self: end; }
        /* 9. Bottom Right */
        .name-grid div:nth-child(9) { justify-self: end; align-self: end; }
    </style>
</head>
<body>

    <!-- Full-screen background image -->
    <img src="myphoto.jpeg" alt="Background photo" class="background">

    <!-- Nine name positions -->
    <div class="name-grid">
        <div>Ayush Kumar</div>
        <div>Ayush Kumar</div>
        <div>Ayush Kumar</div>

        <div>Ayush Kumar</div>
        <div>Ayush Kumar</div>
        <div>Ayush Kumar</div>

        <div>Ayush Kumar</div>
        <div>Ayush Kumar</div>
        <div>Ayush Kumar</div>
    </div>

</body>
</html>
