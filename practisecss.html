<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        body {
            background-color: #d6db7a;
            font-family: Arial, sans-serif;
        }
        #div1 {
            background-color: #c8dbc6;
            padding: 20px;
            border: 2px solid #000;
            margin: 10px;
            border-style: dotted;
        }
        #div2 {
            background-color: #e7d9d9;
            padding: 20px;
            border: 3px solid #000;
            margin: 10px;
            border-style:groove;
        }
    </style>
</head>
<body>
    <h1 align="center" style="background-color: lightgray; border-style:dashed; border-color: black; border-radius: 50px; padding: 40px;">This is my heading</h1>
    <div id="div1">Ayush</div>
    <div id="div2">Ayush</div>
</body>
</html>
