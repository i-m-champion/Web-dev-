<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Side-by-Side Divs</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        /* Main container (400px width by 300px height) */
        .main-div {
            width: 400px;
            height: 300px;
            background-color: #e8f4f8;
            border: 2px solid #333;
            border-radius: 8px;
            
           
            display: flex;
            justify-content: center; 
            align-items: flex-start;     
           justify-content:space-evenly;            
        }

        .inner-div {
            width: 50px;
            height: 50px;
            background-color: #ff6b6b;
            border-radius: 6px;
            justify-content: center;    
            align-items: center;
            margin: 18px;
        }
    </style>
</head>
<body>

    <div class="main-div">
        <div class="inner-div">A</div>
        <div class="inner-div">B</div>
        <div class="inner-div">C</div>
    </div>

</body>
</html>
