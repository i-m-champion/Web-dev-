<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full-Screen 3x3 Responsive Grid</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
    }

    .card {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
      min-height: 100dvh;
      padding: 16px;
    }

    .grid-item {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      border: 1px solid #000000;
      overflow: hidden;
    }

    .grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (min-width: 600px) and (max-width: 768px) {
      .card {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: auto;
        min-height: auto;
      }

      .grid-item {
        min-height: 220px;
      }
    }
    @media (max-width: 599px) {
      .card {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        min-height: auto;
      }

      .grid-item {
        min-height: 220px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="grid-item"><img src="assets/myphoto.jpeg" alt="Image 1" /></div>
    <div class="grid-item"><img src="assets/myphoto2.jpeg" alt="Image 2" /></div>
    <div class="grid-item"><img src="assets/myphoto3.jpeg" alt="Image 3" /></div>
    <div class="grid-item"><img src="assets/myphoto3.jpeg" alt="Image 4" /></div>
    <div class="grid-item"><img src="assets/myphoto2.jpeg" alt="Image 5" /></div>
    <div class="grid-item"><img src="assets/myphoto.jpeg" alt="Image 6" /></div>
    <div class="grid-item"><img src="assets/myphoto.jpeg" alt="Image 7" /></div>
    <div class="grid-item"><img src="assets/myphoto2.jpeg" alt="Image 8" /></div>
    <div class="grid-item"><img src="assets/myphoto3.jpeg" alt="Image 9" /></div>
  </div>
</body>
</html>
