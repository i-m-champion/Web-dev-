<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        div {
            width: 600px;
            height: 300px;
            background-color: rgb(249, 136, 101);
            transition: width 2s, height 2s, background-color 2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        div:hover {
            width: 400px;
            height: 400px;
            background-color: rgb(103, 216, 247);
        }
    </style>
</head>

<body>
    <div>yoyo</div>
</body>

</html>
