<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations</title>
    <style>
        @keyframes myAnimation {
            0% {
                width: 200px;
                height: 200px;
                border-radius: 10px;
                transform: translateX(0px) rotate(0deg);
            }
            100% {
                width: 250px;
                height: 250px;
                border-radius: 50%;
                transform: translateX(777px) rotate(360deg);
            }
        }
        @keyframes myAnimation1 {
            0% {
                width: 200px;
                height: 200px;
                border-radius: 10px;
                transform: translateX(0px) rotate(0deg);
            }
            100% {
                width: 250px;
                height: 250px;
                border-radius: 50%;
                transform: translateX(777px) rotate(-360deg);
            }
        }

        #div1 {
            width: 300px;
            height: 300px;
            background-color: rgb(101, 190, 249);
            border: 2px solid rgb(0, 0, 0);
            border-radius: 10px;
            animation: myAnimation 3.3s infinite alternate;
        }
        #div2 {
            background-color: rgb(101, 190, 249);
            border: 2px solid rgb(0, 0, 0);
            border-radius: 50%;
            animation: myAnimation1 3.3s infinite alternate-reverse;
        }
    </style>
</head>
<body>
    <div id="div1"></div>
    <div id="div2"></div>
</body>
</html>
