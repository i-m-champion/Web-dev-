<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div at the Edge</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
        }

        
        .parent-div {
            position: relative; 
            width: 300px;
            height: 200px;
            background-color: #64c2cb9f;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border: 1px solid #010602;
        }

        .child-div {
            position: absolute;
            bottom: 0;      
            left: 0;     
            background-color: #3ce75e;
            color: white;
            padding: 16px 20px;
            border-radius: 8px;
            border: 1px solid #010602;
            
           
        }
    </style>
</head>
<body>

    <div class="parent-div">
        <div class="child-div">Div2</div>
    </div>

</body>
</html>
</body>
</html>
