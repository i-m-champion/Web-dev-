<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent {
            text-decoration: underline;
            text-transform: uppercase;
            text-align: center;
            vertical-align: middle;
            line-height: 1.5;
        }
        .child {
            text-decoration: line-through;
            text-transform: lowercase;
            text-align: left;
            vertical-align: baseline;
            line-height: 2.7;
        }
    </style>
</head>
<body>
    <h1>TEXT PROPERTIES</h1>
    <div class="parent">
        <p>Text properties control how text looks and sits inside elements</p>
    </div>
    <div class="child">
        <p>Text properties include text color, font size, font family, text alignment, line height, letter spacing, and text decoration</p>
    </div>
</body>
</html>
